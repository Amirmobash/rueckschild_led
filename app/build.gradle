plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.rueckschildled'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.rueckschildled'
        minSdk 14
        targetSdk 28
        versionCode 13
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Intentionally empty: no AndroidX and no third-party runtime libraries.
}
